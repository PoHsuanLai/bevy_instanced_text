[package]
name = "bevy_instanced_text"
version = "0.2.0"
edition = "2021"
authors = ["PoHsuanLai"]
license = "MIT OR Apache-2.0"
readme = "README.md"
description = "GPU-accelerated text rendering engine for Bevy. Provides primitives (glyph atlas, instanced rendering, DisplayLayout, overlays) for building editors, terminals, chat panels, log viewers, and any other text-heavy UI."
repository = "https://github.com/PoHsuanLai/bevy_instanced_text"
keywords = ["bevy", "text", "rendering", "gpu", "engine"]
categories = ["game-development", "rendering"]

[dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_asset",
    "bevy_color",
    "bevy_mesh",
    "bevy_camera",
    "bevy_log",
    "bevy_picking",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
] }
bevy_camera = "0.19"
taffy = { version = "0.9", default-features = false, features = ["std"] }
# Same parley as bevy_text 0.19, for registering asset fonts into our private
# FontContext (FontInfoOverride) — bevy_text doesn't re-export parley.
parley = { version = "0.9", default-features = false, features = ["std"] }

bitflags = "2"
bytemuck = { version = "1.14", features = ["derive"] }
